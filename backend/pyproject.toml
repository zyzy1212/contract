[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-review-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",
    "celery>=5.4,<6.0",
    "redis>=5.2,<6.0",
    "boto3>=1.35,<2.0",
    "openai>=1.57,<2.0",
    "tenacity>=9.0,<10.0",
    "python-multipart>=0.0.18,<1.0",
    "python-docx>=1.1,<2.0",
    "pymupdf>=1.25,<2.0",
    "sentence-transformers>=3.3,<4.0",
    "rank-bm25>=0.2.2,<1.0",
    "jieba>=0.42.1,<1.0",
    "a2a-sdk>=0.3,<1.0",
    "sse-starlette>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "httpx>=0.28,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest-tmp"
markers = [
    "postgresql: requires TEST_DATABASE_URL and exercises PostgreSQL security",
]
